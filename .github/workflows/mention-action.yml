name: Claude Code Mention Action

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude-mention:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
      - name: Check if Claude was mentioned
        id: check-mention
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if echo "$COMMENT_BODY" | grep -i "@claude" > /dev/null; then
            echo "claude_mentioned=true" >> $GITHUB_OUTPUT
          else
            echo "claude_mentioned=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger Claude analysis
        if: steps.check-mention.outputs.claude_mentioned == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Claude Code Analysis
        if: steps.check-mention.outputs.claude_mentioned == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "Claude Code is analyzing the request..."
          echo "Comment: ${{ github.event.comment.body }}"
